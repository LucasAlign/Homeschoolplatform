name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install (locked)
        run: npm ci

      # Pure-logic unit tests — no emulator/JDK needed. Fast, so run first.
      - name: Unit tests
        run: npm run test:unit

      # `next build` compiles the app AND generates next-env.d.ts + route types.
      # It must run BEFORE the standalone tsc step below, which relies on those
      # generated types (e.g. the LayoutProps global in src/app/layout.tsx).
      - name: Build
        run: npm run build

      # Standalone typecheck. This is the ONLY gate that type-checks src/modules/**
      # — the Next build only checks code reachable from a route, and no UI imports
      # the modules yet. Depends on the types generated by the build step.
      - name: Typecheck
        run: npx tsc --noEmit

  # Firestore security-rules tests against the emulator. Split into its own job
  # because it needs a JDK (the emulator is Java) — something the local dev box
  # (JDK 1.8) can't provide, so CI is where these actually run. This exercises the
  # Phase 0 exit gate: household isolation, role scoping, answer-key isolation,
  # consent-field immutability, and non-writable audit. See docs/launch-readiness.md §B.1.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install (locked)
        run: npm ci

      # `firebase emulators:exec` downloads the Firestore emulator jar on first
      # run, boots it, runs the vitest rules suite, then tears it down.
      - name: Firestore rules tests (emulator)
        run: npm run test:rules
