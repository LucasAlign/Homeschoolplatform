kind = "web"
previewPath = "/"
title = "Homeschool Platform"
description = "A curriculum planning platform for homeschool parents. Lets you create and organize courses with units and lessons, write lesson content, and track what's published. Designed for a single parent managing their own children's education."
version = "1.0.0"
id = "artifacts/homeschool"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21529

[services.development]
run = "pnpm --filter @workspace/homeschool run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/homeschool", "run", "build" ]
serve = "static"
publicDir = "artifacts/homeschool/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21529"
BASE_PATH = "/"
